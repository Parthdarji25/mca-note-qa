<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · MCA Notes</title>
  <meta name="description" content="That page does not exist. Go back to the MCA Notes home page.">
  <meta name="robots" content="noindex">
  <script>
    // GitHub Pages serves this file for any missing path, even deep ones. On a project
    // site (<user>.github.io/<repo>/...) the site root is the first path segment, so set
    // <base> to it and every relative URL below keeps working.
    (function () {
      var seg = location.pathname.split("/")[1] || "";
      var root = /\.github\.io$/i.test(location.hostname) && seg ? "/" + seg + "/" : "/";
      document.write('<base href="' + root + '">');
    })();
  </script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="MCA Notes home">
        <span class="brand-mark" aria-hidden="true">#</span>
        <span class="brand-name">MCA Notes</span>
      </a>
    </div>
  </header>

  <main id="main">
    <div class="container not-found">
      <p class="eyebrow">Error 404</p>
      <h1>Page not found</h1>
      <p>The page you were looking for doesn't exist. It may have moved, or the link may be wrong.</p>
      <a class="btn btn-primary" href="index.html">Back to home</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>made by Parth Darji</span>
      <span class="sep" aria-hidden="true">·</span>
      <span>Hosted free on GitHub Pages</span>
      <span class="sep" aria-hidden="true">·</span>
      <a href="https://github.com/Parthdarji25/mca-note-qa" target="_blank" rel="noopener noreferrer">Edit on GitHub</a>
      <span class="sep" aria-hidden="true">·</span>
      <a href="admin/">Admin</a>
    </div>
  </footer>
</body>
</html>
